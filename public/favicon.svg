<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#020C1B"/>
    </linearGradient>
    <linearGradient id="favEagle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="favSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Circular background in rich Navy #0A192F -->
  <rect width="128" height="128" rx="30" fill="url(#favBg)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Dynamic Swoosh -->
  <path d="M 16 80 C 26 100, 60 106, 94 96 C 114 90, 118 78, 116 74 C 104 86, 78 94, 52 90 C 30 86, 20 80, 16 80 Z" fill="#60A5FA"/>
  <path d="M 20 85 C 38 98, 70 98, 98 88 C 84 94, 56 94, 30 88 C 22 86, 20 85, 20 85 Z" fill="#FFFFFF"/>

  <!-- Redesigned Eagle -->
  <g transform="translate(10, 8)">
    <path
      d="M 52 24 C 52 20, 50 14, 44 10 C 40 8, 36 10, 34 12 C 32 14, 30 16, 28 16 C 25 16, 24 14, 25 12 C 27 9, 32 5, 40 4 C 48 3, 55 7, 58 13 C 61 10, 66 8, 72 12 C 70 16, 66 19, 64 23 C 67 25, 73 28, 78 25 C 84 21, 89 15, 95 17 C 98 18, 99 21, 95 25 C 89 31, 80 35, 72 36 C 76 42, 78 50, 78 60 C 78 76, 68 88, 58 96 C 56 92, 55 86, 55 80 C 55 72, 58 64, 60 56 C 58 60, 54 68, 50 74 C 46 68, 43 60, 42 56 C 44 64, 46 72, 46 80 C 46 86, 45 92, 43 96 C 33 88, 24 76, 24 60 C 24 50, 26 42, 30 36 C 22 35, 13 31, 7 25 C 3 21, 4 18, 7 17 C 13 15, 18 21, 24 25 C 29 28, 35 25, 38 23 C 36 19, 32 16, 30 12 Z"
      fill="url(#favEagle)"
    />
  </g>

  <!-- Neoclassical Bank Icon in Right Corner -->
  <g transform="translate(80, 48)">
    <path d="M 18 0 L 0 10 L 36 10 Z" fill="url(#favSilver)"/>
    <rect x="2" y="10" width="32" height="3" fill="url(#favSilver)"/>
    <rect x="4" y="14" width="4" height="15" fill="url(#favSilver)"/>
    <rect x="12" y="14" width="4" height="15" fill="url(#favSilver)"/>
    <rect x="20" y="14" width="4" height="15" fill="url(#favSilver)"/>
    <rect x="28" y="14" width="4" height="15" fill="url(#favSilver)"/>
    <rect x="2" y="30" width="32" height="3" fill="url(#favSilver)"/>
    <rect x="0" y="33" width="36" height="4" fill="url(#favSilver)"/>
  </g>
</svg>
