<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#050C18"/>
    </linearGradient>

    <linearGradient id="favShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0047AB"/>
      <stop offset="100%" stop-color="#001F4D"/>
    </linearGradient>

    <linearGradient id="favHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4D94FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <linearGradient id="favSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="favSwoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>

    <linearGradient id="favLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Deep Navy Container with Rounded Corners & Subtle Border -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#0066FF" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Centered Aegis Shield with Colonnade & Swoosh -->
  <g transform="translate(14, 12) scale(0.63)">
    <!-- Outer Aegis Diamond-Shield Crest -->
    <path
      d="M 80 10 L 138 38 C 138 92, 110 128, 80 148 C 50 128, 22 92, 22 38 Z"
      fill="url(#favShield)"
    />

    <!-- Inner Shield Bevel Highlight -->
    <path
      d="M 80 18 L 130 42 C 130 88, 106 120, 80 138 C 54 120, 30 88, 30 42 Z"
      fill="url(#favHighlight)"
      opacity="0.9"
    />

    <!-- Inner Vault Core -->
    <path
      d="M 80 26 L 122 47 C 122 82, 102 110, 80 126 C 58 110, 38 82, 38 47 Z"
      fill="#0A192F"
    />

    <!-- Neoclassical Bank Colonnade -->
    <g transform="translate(44, 46)">
      <polygon points="36,4 4,20 68,20" fill="url(#favSilver)" stroke="#003366" stroke-width="1" />
      <rect x="6" y="20" width="60" height="5" rx="1" fill="url(#favSilver)" />

      <!-- 4 Columns -->
      <rect x="11" y="27" width="7" height="28" rx="1.5" fill="url(#favSilver)" />
      <rect x="25" y="27" width="7" height="28" rx="1.5" fill="url(#favSilver)" />
      <rect x="39" y="27" width="7" height="28" rx="1.5" fill="url(#favSilver)" />
      <rect x="53" y="27" width="7" height="28" rx="1.5" fill="url(#favSilver)" />

      <!-- Base -->
      <rect x="4" y="57" width="64" height="4" rx="1" fill="url(#favSilver)" />
      <rect x="1" y="61" width="70" height="5" rx="1" fill="url(#favSilver)" />
    </g>

    <!-- Chrome Silver Swoosh -->
    <path
      d="M 12 102 C 24 134, 52 148, 80 148 C 114 148, 142 122, 150 96 C 132 114, 106 124, 78 122 C 50 120, 28 108, 12 102 Z"
      fill="url(#favSwoosh)"
    />

    <!-- Electric Swoosh Upper Wing -->
    <path
      d="M 50 96 C 80 88, 122 66, 142 32 C 150 20, 152 12, 152 8 C 150 14, 138 36, 118 56 C 96 76, 68 90, 50 96 Z"
      fill="#00D4FF"
    />

    <!-- Lime Accent at Crest -->
    <circle cx="152" cy="8" r="4.5" fill="url(#favLime)" />
  </g>
</svg>
