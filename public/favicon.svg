<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#050C18"/>
    </linearGradient>

    <linearGradient id="favB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#0047AB"/>
      <stop offset="100%" stop-color="#001F4D"/>
    </linearGradient>

    <linearGradient id="favHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#4D94FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <linearGradient id="favSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="favSwoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>

    <linearGradient id="favLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Deep Navy Container with Rounded Corners & Subtle Border -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#0066FF" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Centered Iconic 'B' with Colonnade & Swoosh -->
  <g transform="translate(14, 12) scale(0.64)">
    <!-- Outer Lower Spine of 'B' -->
    <path
      d="M 28 15 L 82 15 C 104 15, 122 28, 122 48 C 122 62, 112 72, 98 77 C 118 82, 132 96, 132 114 C 132 136, 110 148, 84 148 L 28 148 Z"
      fill="url(#favB)"
    />

    <!-- Top Bow Highlight -->
    <path
      d="M 28 15 L 82 15 C 102 15, 118 26, 118 46 C 118 60, 108 70, 94 75 L 28 75 Z"
      fill="url(#favHighlight)"
      opacity="0.95"
    />

    <!-- Top Inner Cutout of B -->
    <path
      d="M 52 32 L 80 32 C 90 32, 98 38, 98 48 C 98 58, 90 64, 80 64 L 52 64 Z"
      fill="#0A192F"
    />

    <!-- Lower Inner Cutout of B -->
    <path
      d="M 52 86 L 82 86 C 94 86, 106 94, 106 108 C 106 122, 94 130, 82 130 L 52 130 Z"
      fill="#0A192F"
    />

    <!-- Neoclassical Bank Colonnade -->
    <g transform="translate(32, 38)">
      <polygon points="36,4 4,20 68,20" fill="url(#favSilver)" stroke="#003366" stroke-width="1" />
      <rect x="6" y="20" width="60" height="5" rx="1" fill="url(#favSilver)" />

      <!-- 4 Columns -->
      <rect x="11" y="27" width="7" height="28" rx="1.5" fill="url(#favSilver)" />
      <rect x="25" y="27" width="7" height="28" rx="1.5" fill="url(#favSilver)" />
      <rect x="39" y="27" width="7" height="28" rx="1.5" fill="url(#favSilver)" />
      <rect x="53" y="27" width="7" height="28" rx="1.5" fill="url(#favSilver)" />

      <!-- Base -->
      <rect x="4" y="57" width="64" height="4" rx="1" fill="url(#favSilver)" />
      <rect x="1" y="61" width="70" height="5" rx="1" fill="url(#favSilver)" />
    </g>

    <!-- Chrome Silver Swoosh -->
    <path
      d="M 6 92 C 14 122, 42 144, 76 132 C 104 122, 128 92, 136 70 C 120 86, 96 102, 70 106 C 42 110, 22 98, 6 92 Z"
      fill="url(#favSwoosh)"
    />

    <!-- Electric Swoosh Upper Wing -->
    <path
      d="M 44 94 C 74 86, 112 66, 134 32 C 142 20, 146 12, 146 8 C 144 14, 134 36, 114 56 C 92 76, 62 88, 44 94 Z"
      fill="#0099FF"
    />

    <!-- Lime Accent at Crest -->
    <circle cx="146" cy="8" r="4.5" fill="url(#favLime)" />
  </g>
</svg>
